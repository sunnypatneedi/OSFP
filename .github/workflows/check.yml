name: check

# Runs the zero-dependency checks on every push to main and on every pull request.
# Read-only permissions. pull_request, never pull_request_target.
# actions/checkout is pinned to a full commit SHA, because a moved tag is a
# supply-chain risk. Re-pin on purpose, in its own commit.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: node --version
      - run: node scripts/check-standard.mjs
      - run: node scripts/check-osfp.mjs
      - run: node scripts/self-test.mjs
